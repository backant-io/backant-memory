name: Publish to npm

on:
  release:
    types: [published]   # cut a GitHub Release from main -> publishes
  workflow_dispatch:      # manual trigger (e.g. the first 1.4.0 publish)

jobs:
  publish:
    name: Publish to npm (trusted publishing via OIDC)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm (OIDC — no token, provenance automatic)
        run: npm publish --access public
