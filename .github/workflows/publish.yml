name: Publish to npm

on:
  release:
    types: [published]   # cut a GitHub Release from main -> publishes
  workflow_dispatch:      # manual trigger (e.g. the first 1.4.0 publish)

jobs:
  publish:
    name: Publish to npm (trusted publishing via OIDC)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Fail early if this version is already on npm
        run: |
          PKG=$(jq -r .name package.json)
          VER=$(jq -r .version package.json)
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::error::$PKG@$VER already exists on npm — bump the version in package.json before publishing."
            exit 1
          fi
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11   # npm 12 requires node >=22; 11.5.1+ suffices for OIDC trusted publishing
      - name: Install dependencies
        run: npm ci
      - name: Test (an immutable publish must be gated by the suite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish to npm (OIDC — no token, provenance automatic)
        run: npm publish --access public
